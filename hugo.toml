# 站点基础信息
baseURL = "https://oyzecheng.github.io/"
title = "Owen's Blog"
locale = "en-us"
defaultContentLanguage = "en"
theme = "PaperMod"

enableRobotsTXT = true           # 生成 robots.txt，允许搜索引擎抓取
enableInlineShortcodes = true
buildDrafts = false
buildFuture = false
buildExpired = false

# 文章列表每页数量
[pagination]
  pagerSize = 10

# 首页额外输出 JSON，用于站内搜索
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 代码高亮（使用 Hugo 内置 chroma）
[markup]
  [markup.highlight]
    noClasses = false

# 顶部导航菜单
[menu]
  [[menu.main]]
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "Archives"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 40
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 50

[params]
  env = "production"
  # 站点描述：会出现在搜索结果摘要里，建议写含目标关键词的一句话
  description = "Useful content and resources."
  defaultTheme = "auto"          # auto / light / dark
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # 首页顶部展示的简介（不含任何个人身份信息）
  [params.homeInfoParams]
    Title = "Welcome"
    Content = "Sharing useful content and resources here. Feel free to look around."

  # 站内搜索（fuse.js）参数
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.assets]
    disableHLJS = true
