# 站点基础信息
baseURL = "https://oyzecheng.github.io/"
title = "我的博客"                # TODO: 换成你的站点名（建议含目标关键词，利于 SEO）
locale = "zh-cn"
defaultContentLanguage = "zh"
theme = "PaperMod"

enableRobotsTXT = true           # 生成 robots.txt，允许搜索引擎抓取
enableInlineShortcodes = true
buildDrafts = false
buildFuture = false
buildExpired = false

# 文章列表每页数量
[pagination]
  pagerSize = 10

# 首页额外输出 JSON，用于站内搜索
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 代码高亮（使用 Hugo 内置 chroma）
[markup]
  [markup.highlight]
    noClasses = false

# 顶部导航菜单
[menu]
  [[menu.main]]
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    name = "标签"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    name = "搜索"
    url = "/search/"
    weight = 40
  [[menu.main]]
    name = "关于"
    url = "/about/"
    weight = 50

[params]
  env = "production"
  # 站点描述：会出现在搜索结果摘要里，建议写含目标关键词的一句话
  description = "分享有用的内容与资源"
  defaultTheme = "auto"          # auto / light / dark
  ShowReadingTime = true
  ShowWordCount = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # 首页顶部展示的简介（不含任何个人身份信息）
  [params.homeInfoParams]
    Title = "欢迎"
    Content = "这里分享一些内容与资源，欢迎浏览。"

  # 站内搜索（fuse.js）参数
  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.assets]
    disableHLJS = true
